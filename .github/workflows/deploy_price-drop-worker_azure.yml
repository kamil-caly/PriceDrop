name: Deploy PriceDrop Worker

on:
  push:
    branches:
      - release

env:
  AZURE_FUNCTIONAPP_NAME: price-drop-worker
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: PriceDropWorker/PriceDropWorker.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ./publish --no-build

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          sku: flexconsumption
          publish-profile: ${{ secrets.AZURE_FUNCTION_APP__PRICE_DROP_WORKER__PUBLISHPROFILE }}
